[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cuswap"
version = "0.1.0"
description = "Switch Cursor IDE accounts locally — list usage, status, and swap sessions without website login/logout."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "cuswap" }]
keywords = ["cursor", "account", "switcher", "cli"]
dependencies = [
  "httpx>=0.27",
  "rich>=13.7",
  "typer>=0.15",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
cuswap = "cuswap.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/cuswap"]

[tool.hatch.build.targets.sdist]
include = ["src/cuswap", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv]
package = true
